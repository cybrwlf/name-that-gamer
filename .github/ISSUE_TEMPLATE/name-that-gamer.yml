name: Name that gamer
description: Put a name to one of the unidentified faces
title: "Gamer #"
labels: ["name-that-gamer"]
body:
  - type: markdown
    attributes:
      value: |
        **Please leave the title alone.** The number in it is how we know which face you mean.

        **Everything you write here is public.** Anyone can read it, with or without a GitHub
        account, and search engines index it. So there is no box for an email address, a real
        name or a Steam ID, and please do not put one in the notes either. If you would rather
        not do this in the open, say so in the notes and we will take it from there.

        The gamer handle is the only thing we really need. Everything else is optional.

  - type: dropdown
    id: relationship
    attributes:
      label: How do you know this person?
      options:
        - That is me
        - I know them
        - I think I know them, not certain
    validations:
      required: true

  - type: input
    id: handle
    attributes:
      label: Gamer Handle
      description: What they went by online. Include the clan tag if they used one.
      placeholder: "[GoDS]TheCyberWolf"
    validations:
      required: true

  - type: dropdown
    id: clan
    attributes:
      label: Clan
      description: >
        Optional. Plenty of people ran solo, and if you are naming someone else you may simply not
        know. Pick "Other" and use the box below for anything missing from this list.
      options:
        - ""
        - GoDS
        - s2i
        - XP
        - LAN Synergy (LANS)
        - theGXL
        - Weekend Wars (WW)
        - ill Gaming
        - HavokLAN
        - Wicked Lans
        - NJ Gamers
        - New Jersey LAN
        - NJ LAN Party
        - CFM LAN
        - Maryland LAN Gamers
        - War Room Gaming
        - FITES
        - SJLP
        - TGS
        - RR
        - PW
        - DUPC
        - Solo, no clan
        - Do not know
        - Other, typed below

  - type: input
    id: clan_other
    attributes:
      label: Clan, if it is not on that list
      description: Optional. Only fill this in if you picked "Other" above.

  - type: checkboxes
    id: contact
    attributes:
      label: Getting back to you
      description: >
        Nothing here shares an address. The first one just means we can reply on this issue.
      options:
        - label: Happy for CybrWlf to @ me here if he needs permission to use this name
        - label: I can pass this along to them and point them at the site

  - type: checkboxes
    id: problems
    attributes:
      label: Something wrong with the card?
      description: The faces were grouped automatically, so the grouping is often wrong.
      options:
        - label: This card has more than one person on it
        - label: This person also shows up on another card
        - label: One or more of these crops is not a face at all

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >
        Which other card they are on, which LANs you remember them at, anything. No contact
        details please, this box is public too.
